<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Chapter Viewer</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Georgia;
            max-width: 800px;
            margin: auto;
            padding: 40px 20px 80px;
            line-height: 1.8;
        }

        .chapter-nav {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 24px;
        }

        .chapter-nav a {
            color: gold;
            text-decoration: none;
            font-weight: bold;
        }

        .chapter-nav a:hover {
            text-decoration: underline;
        }

        .chapter-frame {
            width: 100%;
            min-height: 70vh;
            border: 1px solid #444;
            border-radius: 10px;
            background: white;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: lightgray;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .audio-player {
            margin-top: 20px;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .audio-player button {
            background: gold;
            color: #111;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
        }

        .audio-player input[type="range"] {
            width: 100px;
        }
    </style>
</head>
<body>
    <a class="back-link" href="../story.html">← Back to Story</a>

    <div class="chapter-nav">
        <a id="prevLink" href="#">← Previous Chapter</a>
        <a id="nextLink" href="#">Next Chapter →</a>
    </div>

    <iframe id="chapterFrame" class="chapter-frame" title="Chapter content"></iframe>

    <div class="audio-player">
        <audio id="chapterAudio" preload="auto"></audio>
        <button id="prevTrackBtn" type="button">←</button>
        <button id="playPauseBtn" type="button">Play</button>
        <button id="nextTrackBtn" type="button">→</button>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.5">
    </div>

    <script>
        const chapterFiles = [
            'prologue.txt',
            '1.txt', '2.txt', '3.txt', '4.txt', '5.txt', '6.txt', '7.txt', '8.txt', '9.txt',
            '10.txt', '11.txt', '12.txt', '13.txt', '14.txt', '15.txt', '16.txt', '17.txt', '18.txt', '19.txt',
            '20.txt', '21.txt', '22.txt', '23.txt', '24.txt', '25.txt', '26.txt', '27.txt', '28.txt', '29.txt',
            '30.txt', '31.txt'
        ];

        const params = new URLSearchParams(window.location.search);
        const requestedChapter = params.get('chapter') || 'prologue.txt';
        const safeChapter = chapterFiles.includes(requestedChapter) ? requestedChapter : 'prologue.txt';
        const chapterIndex = chapterFiles.indexOf(safeChapter);

        const prevLink = document.getElementById('prevLink');
        const nextLink = document.getElementById('nextLink');
        const frame = document.getElementById('chapterFrame');
        const audio = document.getElementById('chapterAudio');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevTrackBtn = document.getElementById('prevTrackBtn');
        const nextTrackBtn = document.getElementById('nextTrackBtn');
        const volumeSlider = document.getElementById('volumeSlider');

        if (chapterIndex > 0) {
            prevLink.href = './viewer.html?chapter=' + encodeURIComponent(chapterFiles[chapterIndex - 1]);
        } else {
            prevLink.style.display = 'none';
        }

        if (chapterIndex < chapterFiles.length - 1) {
            nextLink.href = './viewer.html?chapter=' + encodeURIComponent(chapterFiles[chapterIndex + 1]);
        } else {
            nextLink.style.display = 'none';
        }

        frame.src = './' + safeChapter;

        const playlist = [
            '../music/Moonlit%20Eternity.mp3',
            '../music/Moonlit%20Oath.mp3',
            '../music/Moonlit%20Resolve.mp3',
            '../music/Moonlit%20School.mp3',
            '../music/Moonlit%20Serenade.mp3',
            '../music/Moonlit%20Showdown.mp3'
        ];
        const stateKey = 'chapter-viewer-audio-state';
        let currentTrackIndex = 0;

        audio.volume = 0.5;
        volumeSlider.value = audio.volume;

        function loadState() {
            try {
                return JSON.parse(localStorage.getItem(stateKey)) || {};
            } catch (e) {
                return {};
            }
        }

        function saveState() {
            const state = {
                currentTrackIndex,
                currentTime: audio.currentTime,
                volume: audio.volume,
                isPlaying: !audio.paused
            };
            localStorage.setItem(stateKey, JSON.stringify(state));
        }

        function restoreState() {
            const state = loadState();
            if (state.currentTrackIndex != null) {
                currentTrackIndex = state.currentTrackIndex;
            }
            if (state.volume != null) {
                audio.volume = state.volume;
                volumeSlider.value = audio.volume;
            }
            if (state.currentTime != null) {
                audio.currentTime = state.currentTime;
            }
            return state;
        }

        function updatePlayButton() {
            playPauseBtn.textContent = audio.paused ? 'Play' : 'Pause';
        }

        function playCurrentTrack() {
            if (!audio.src) {
                audio.src = playlist[currentTrackIndex];
            } else if (audio.currentSrc !== playlist[currentTrackIndex]) {
                audio.src = playlist[currentTrackIndex];
            }
            audio.load();
            const tryPlay = () => {
                const promise = audio.play();
                if (promise && typeof promise.catch === 'function') {
                    promise.catch(() => {
                        setTimeout(tryPlay, 250);
                    });
                }
            };
            setTimeout(tryPlay, 100);
            updatePlayButton();
        }

        function playNextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            playCurrentTrack();
        }

        function startAutoPlay() {
            if (audio.paused && audio.src) {
                playCurrentTrack();
            }
        }

        function setPlaybackState() {
            updatePlayButton();
        }

        function goToPreviousTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            playCurrentTrack();
        }

        function goToNextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            playCurrentTrack();
        }

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                playCurrentTrack();
            } else {
                audio.pause();
            }
        });

        prevTrackBtn.addEventListener('click', goToPreviousTrack);
        nextTrackBtn.addEventListener('click', goToNextTrack);

        volumeSlider.addEventListener('input', (event) => {
            audio.volume = Number(event.target.value);
            saveState();
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedState = restoreState();
            if (savedState.isPlaying) {
                audio.src = playlist[currentTrackIndex];
                audio.load();
                setTimeout(() => {
                    playCurrentTrack();
                }, 300);
            } else {
                audio.src = playlist[currentTrackIndex];
                audio.load();
                setTimeout(startAutoPlay, 300);
            }
        });
        window.addEventListener('pointerdown', startAutoPlay, { once: true });
        window.addEventListener('keydown', startAutoPlay, { once: true });
        window.addEventListener('load', startAutoPlay);

        audio.addEventListener('play', () => {
            saveState();
            setPlaybackState();
        });
        audio.addEventListener('pause', () => {
            saveState();
            setPlaybackState();
        });
        audio.addEventListener('timeupdate', saveState);
        audio.addEventListener('ended', playNextTrack);
        window.addEventListener('beforeunload', saveState);
        updatePlayButton();
    </script>
</body>
</html>
