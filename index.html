<!DOCTYPE html>
<html>
<head>
    <title>My Story</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Georgia;
            max-width: 800px;
            margin: auto;
            padding: 40px 40px 120px;
        }

        h1 {
            color: gold;
        }

        h2 {
            color: lightgray;
        }

        p {
            line-height: 1.7;
        }

        .image-link {
            cursor: pointer;
            display: inline-block;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal:target {
            display: flex;
        }

        .modal img {
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            border: 2px solid white;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 32px;
            text-decoration: none;
        }

        .audio-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid #444;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2000;
        }

        .audio-player button,
        .audio-player input {
            font: inherit;
        }
    </style>
</head>

<body>

<h1>Welcome to Superheroine Studios</h1>

<a class="image-link" href="#morgana-modal">
    <img src="./images/morgana.png" alt="Morgana" style="width:100%; max-width:500px; border-radius:12px; margin:20px 0;">
</a>

<div id="morgana-modal" class="modal">
    <a href="#" class="close">×</a>
    <img src="./images/morgana.png" alt="Morgana enlarged">
</div>

<p>Enjoy Our Current Stories.</p>

<p>The current main story is about a young girl with incredible powers who must navigate the challenges of her new identity.</p>

<h2>Story</h2>
<a class="image-link" href="#yuki-modal">
    <img src="./images/yuki3.png" alt="Yuki" style="width:100%; max-width:500px; border-radius:12px; margin:20px 0;">
</a>
<div id="yuki-modal" class="modal">
    <a href="#" class="close">×</a>
    <img src="./images/yuki3.png" alt="Yuki enlarged">
</div>
<p><a href="./story.html">Read the main story</a></p>

<h2>Characters</h2>
<p><a href="./rin.html">View characters</a></p>

<div class="audio-player">
    <audio id="siteAudio" preload="auto" loop>
        <source src="./music/Princess%20Bounty%20Hunter%20(3).mp3" type="audio/mpeg">
    </audio>
    <button id="playPauseBtn" type="button">Play</button>
    <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.5">
    <button id="muteBtn" type="button">Mute</button>
</div>

<script>
const AUDIO_STATE_KEY = 'storysite-audio-state';
const audio = document.getElementById('siteAudio');
const playPauseBtn = document.getElementById('playPauseBtn');
const volumeSlider = document.getElementById('volumeSlider');
const muteBtn = document.getElementById('muteBtn');

audio.volume = 0.5;
audio.muted = false;
audio.src = './music/Princess%20Bounty%20Hunter%20(3).mp3';
audio.load();

function loadState() {
    try {
        return JSON.parse(localStorage.getItem(AUDIO_STATE_KEY)) || {};
    } catch (e) {
        return {};
    }
}

function saveState() {
    const state = {
        isPlaying: !audio.paused,
        currentTime: audio.currentTime,
        volume: audio.volume,
        muted: audio.muted
    };
    localStorage.setItem(AUDIO_STATE_KEY, JSON.stringify(state));
}

function updateControls() {
    playPauseBtn.textContent = audio.paused ? 'Play' : 'Pause';
    muteBtn.textContent = audio.muted ? 'Unmute' : 'Mute';
    volumeSlider.value = audio.volume;
}

function pauseAudio() {
    audio.pause();
    saveState();
    updateControls();
}

function resumeAudio() {
    audio.volume = 0.5;
    audio.muted = false;
    const playback = audio.play();
    if (playback && typeof playback.then === 'function') {
        playback.then(() => {
            saveState();
            updateControls();
        }).catch(() => {
            updateControls();
        });
    } else {
        saveState();
        updateControls();
    }
}

function applyState(state) {
    if (state.volume != null) audio.volume = state.volume;
    if (state.muted != null) audio.muted = state.muted;
    if (state.currentTime != null) audio.currentTime = state.currentTime;
    if (state.isPlaying === true || Object.keys(state).length === 0) {
        resumeAudio();
    } else {
        pauseAudio();
    }
}

function startAudioFromLoad() {
    const state = loadState();
    if (state.currentTime != null) {
        audio.currentTime = state.currentTime;
    }
    applyState(state);
    updateControls();
    setTimeout(() => {
        if (audio.paused) {
            resumeAudio();
        }
    }, 500);
}

function startAudioOnFirstInteraction() {
    resumeAudio();
    window.removeEventListener('pointerdown', startAudioOnFirstInteraction);
    window.removeEventListener('keydown', startAudioOnFirstInteraction);
}

document.addEventListener('DOMContentLoaded', startAudioFromLoad);
window.addEventListener('pageshow', startAudioFromLoad);
window.addEventListener('pointerdown', startAudioOnFirstInteraction, { once: true });
window.addEventListener('keydown', startAudioOnFirstInteraction, { once: true });

playPauseBtn.addEventListener('click', () => {
    if (audio.paused) {
        resumeAudio();
    } else {
        pauseAudio();
    }
});

volumeSlider.addEventListener('input', (event) => {
    audio.volume = Number(event.target.value);
    saveState();
    updateControls();
});

muteBtn.addEventListener('click', () => {
    audio.muted = !audio.muted;
    saveState();
    updateControls();
});

audio.addEventListener('play', () => {
    saveState();
    updateControls();
});

audio.addEventListener('pause', () => {
    saveState();
    updateControls();
});

audio.addEventListener('timeupdate', saveState);
audio.addEventListener('ended', saveState);
window.addEventListener('beforeunload', saveState);

document.querySelectorAll('a[href$=".txt"]').forEach((link) => {
    link.addEventListener('click', () => {
        pauseAudio();
    });
});
</script>

</body>
</html>
