        h1 {

        }

        p {
            line-height: 1.7;
        }

        .image-link {
            cursor: pointer;
            display: inline-block;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal:target {
            display: flex;
        }

        .modal img {
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            border: 2px solid white;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 32px;
            text-decoration: none;
        }
    </style>
